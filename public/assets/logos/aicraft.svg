<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4a030"/>
      <stop offset="40%" style="stop-color:#f0e090"/>
      <stop offset="60%" style="stop-color:#c8a45c"/>
      <stop offset="100%" style="stop-color:#8b6914"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#b8860b"/>
      <stop offset="100%" style="stop-color:#f5e6a0"/>
    </linearGradient>
    <filter id="shine">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b" opacity="0.4"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="500" height="500" fill="#0a0e17"/>

  <!-- Subtle radial bg -->
  <circle cx="250" cy="220" r="200" fill="url(#g)" opacity="0.03"/>

  <!-- LOGO MARK: Stylized 'A' formed by intersecting crystal facets -->
  <g transform="translate(250,195)" filter="url(#shine)">
    <!-- Left stroke — sharp taper -->
    <polygon points="-105,160 -55,160 -5,-110 -45,-110" fill="url(#g)"/>
    <!-- Right stroke — sharp taper -->
    <polygon points="105,160 55,160 5,-110 45,-110" fill="url(#g2)"/>
    <!-- Crossbar — with glow -->
    <polygon points="-90,35 90,35 70,70 -70,70" fill="url(#g)" opacity="0.95"/>
    <!-- Crown diamond -->
    <polygon points="0,-140 35,-95 0,-70 -35,-95" fill="url(#g2)"/>
    <!-- Diamond center highlight -->
    <polygon points="0,-125 20,-95 0,-80 -20,-95" fill="#fff" opacity="0.2"/>
  </g>

  <!-- Neural nodes -->
  <circle cx="115" cy="280" r="4" fill="none" stroke="#3b82f6" stroke-width="1.5" opacity="0.6">
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="385" cy="280" r="4" fill="none" stroke="#8b5cf6" stroke-width="1.5" opacity="0.6">
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="250" cy="325" r="4" fill="none" stroke="#10b981" stroke-width="1.5" opacity="0.6">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
  </circle>
  <!-- Connection lines -->
  <line x1="145" y1="215" x2="118" y2="277" stroke="#3b82f6" stroke-width="0.5" opacity="0.2"/>
  <line x1="355" y1="215" x2="382" y2="277" stroke="#8b5cf6" stroke-width="0.5" opacity="0.2"/>
  <line x1="250" y1="285" x2="250" y2="321" stroke="#10b981" stroke-width="0.5" opacity="0.2"/>

  <!-- Brand -->
  <text x="250" y="380" text-anchor="middle" font-family="'Inter',system-ui,sans-serif" font-size="48" font-weight="800" letter-spacing="6" fill="url(#g)">AICRAFT</text>
  <text x="250" y="410" text-anchor="middle" font-family="'Inter',system-ui,sans-serif" font-size="12" font-weight="600" letter-spacing="8" fill="#6b7280">API · STUDIO · SKILLS</text>
</svg>
