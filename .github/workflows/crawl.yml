name: crawl
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  crawl:
    if: github.event_name != 'issue_comment'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: 跑管线（同一份 crawler/run.mjs；无 token 本地模式在 CI 有 GITHUB_TOKEN）
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: npm run crawl --silent
      - name: 数据确有变化才提交（push 触发 deploy.yml 的 paths 过滤）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # pending/ 只在有待审条目时才被创建（run.mjs 按 pending.changes.length 决定写盘），
          # 且它不是仓库里的跟踪路径——`git add data pending` 在目录不存在时直接 pathspec 128。
          git add data
          if [ -d pending ]; then git add pending; fi
          if git diff --cached --quiet; then
            echo "无实质数据变化，跳过提交"
          else
            git commit -m "chore(crawl): 上游同步（trigger ${{ github.sha }}）"
            git push
          fi

  review:
    # (C)：只按 label 触发。命令解析（大小写/前导空白/多行/逗号）唯一实现是 scripts/review-apply.mjs 的
    # parseCommands；无指令时 runReview 返回 changed:false，本 job 空跑退出，绝不落任何数据。
    if: >-
      github.event_name == 'issue_comment'
      && contains(github.event.issue.labels.*.name, 'review')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: 合入盖章结果（applyDecisions 与 /admin 同一语义；校验不过就整体失败）
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: node scripts/review-apply.mjs
      - name: 提交合入后的数据
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # (C) 放宽触发后，审核 Issue 下的每条评论都会起本 job；无指令时 review-apply 早退
          # 且不写任何文件，pending/ 目录根本不存在 → `git add data pending` 会 pathspec 128，
          # 「空跑退出 0」就成了谎话。与 crawl job 同一处置：data 恒加，pending 存在才加。
          git add data
          if [ -d pending ]; then git add pending; fi
          if git diff --cached --quiet; then
            echo "数据未变，跳过提交"
          else
            git commit -m "chore(review): 盖章合入 issue#${{ github.event.issue.number }}"
            git push
          fi
